services:
  - type: web
    name: stockpred-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 app.main:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
